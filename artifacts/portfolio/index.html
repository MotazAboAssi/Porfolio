    <script>
      // Keep these font URLs aligned with the stylesheet below.
      try {
        if (localStorage.getItem('motaz-portfolio-language') === 'ar') {
          for (const href of [
            'https://fonts.gstatic.com/s/ibmplexsansarabic/v15/Qw3CZRtWPQCuHme67tEYUIx3Kh0PHR9N6Ys43PWrfQ.woff2',
            'https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2',
          ]) {
            const preload = document.createElement('link');
            preload.rel = 'preload';
            preload.as = 'font';
            preload.type = 'font/woff2';
            preload.crossOrigin = 'anonymous';
            preload.href = href;
            document.head.append(preload);
          }
        }
      } catch {
        // Ordinary font loading still works if browser storage is unavailable.
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
